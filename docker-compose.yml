services:
  mail:
    # 钉版本：`latest` 漂移会让 e2e 环境不可复现（本地已验证的是 v1.31.1）
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assay_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assay -d assay_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override DB URLs to point to the compose db service instead of localhost
      # pi-lens-ignore: line-length
      DATABASE_URL: postgresql://assay:postgres@db:5432/assay_development
      # pi-lens-ignore: line-length
      DATABASE_DIRECT_URL: postgresql://assay:postgres@db:5432/assay_development
      # HTTP (no SSL proxy in Docker)
      NEXTAUTH_URL: http://localhost:3000/api/auth
      HOST_URL: http://localhost:3000
      # Local mail catcher — view sent emails at http://localhost:8025
      AUTH_EMAIL_SERVER: smtp://mail:1025
      AUTH_EMAIL_FROM: assay@localhost
    volumes:
      - .:/app
      - /app/node_modules # preserve node_modules installed in image
      - /app/.next # preserve Next.js build cache
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate --no-hints &&
             npx prisma migrate deploy &&
             npx next dev -p 3000"

volumes:
  postgres_data:
