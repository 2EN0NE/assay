name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动重跑：改名、依赖升级后不必为了验证 CI 而造一个空提交。
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推时取消上一次：CI 是门禁，不是审计日志（历史在 Actions 的 runs 页）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 类型来自生成产物：跳过这步时 `tsc` 会看到 @prisma/client 的 stub 类型，
      # 报出一批"字段不存在"的假错误（见 AGENTS.md 的陈旧缓存陷阱）。
      - name: Generate Prisma client
        run: npx prisma generate --no-hints
      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Jest (coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --no-hints
      # CI 跑的是 test:coverage：coverageThreshold 只在这条命令下生效。
      # 本地只跑 npm test 会看不到门槛，历史上因此出现过"本地全绿、CI 全红"。
      - name: Run unit tests with coverage gates
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E + production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --no-hints
      # compose 的 app 服务声明了 env_file: .env；CI 里没有这个未跟踪文件，
      # 而 `docker compose exec` 解析配置时要求它存在（即使只操作 db 服务）。
      # 各步骤真正的值由下方 env 覆盖，这里只是让 compose 有文件可读。
      - name: Create .env for compose
        run: cp .env.example .env
      - name: Start database and mail catcher
        run: docker compose up -d --wait db mail
      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          # pi-lens-ignore: line-length
          DATABASE_URL: postgresql://assay:postgres@localhost:5432/assay_development
          # pi-lens-ignore: line-length
          DATABASE_DIRECT_URL: postgresql://assay:postgres@localhost:5432/assay_development

      # 空库上的 `migrate deploy` 只证明"迁移能被应用"，不证明"**已有数据**的库升级后
      # 数据是对的"。本次三条迁移各带一条回填（confirmedByUserId = 作者、nameNormalized
      # = lower(name)）或一条约束收紧（Tag 唯一键），写错的后果都是**静默改写历史读数**
      # ——那不会有任何其它测试变红。见 scripts/verify-migration-upgrade.ts。
      - name: Verify migration upgrade path (with data)
        run: npx tsx scripts/verify-migration-upgrade.ts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # pi-lens-ignore: line-length
          DATABASE_URL: postgresql://assay:postgres@localhost:5432/assay_development
          # pi-lens-ignore: line-length
          DATABASE_DIRECT_URL: postgresql://assay:postgres@localhost:5432/assay_development
          NEXTAUTH_URL: http://localhost:3000/api/auth
          HOST_URL: http://localhost:3000
          AUTH_EMAIL_SERVER: smtp://localhost:1025
          AUTH_EMAIL_FROM: assay@localhost
          SECRET: e2e-test-secret-do-not-use-in-production
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # 生产构建也必须过门（tsc 与 lint 都不覆盖 Next 的构建期检查：页面导出、
      # getStaticProps 的返回形状、SSR 期依赖）。放在这个 job 里是因为
      # `pages/global-stats.tsx` 的 getStaticProps 会读库，需要已迁移的 Postgres——
      # 这里正好有一个，不必再起一个 job。
      - name: Build (production)
        run: npx next build
        env:
          # pi-lens-ignore: line-length
          DATABASE_URL: postgresql://assay:postgres@localhost:5432/assay_development
          # pi-lens-ignore: line-length
          DATABASE_DIRECT_URL: postgresql://assay:postgres@localhost:5432/assay_development
          NEXTAUTH_URL: http://localhost:3000/api/auth
          HOST_URL: http://localhost:3000
          SECRET: e2e-test-secret-do-not-use-in-production

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 生产依赖目前仍有高危项待升级。这里只做**报告**：写成阻塞门禁会让 main
    # 长期变红，而长期红的门禁等于没有门禁。修完高危项后把 `|| echo` 去掉即可转为阻塞。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high \
            || echo "::warning::生产依赖存在高危项（见上方明细），当前仅报告，不阻塞合并"
