name: Test

on:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage gates
        run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --no-hints

      - name: Start database and mail catcher
        run: docker compose up -d --wait db mail

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          # pi-lens-ignore: line-length
          DATABASE_URL: postgresql://fatebook:postgres@localhost:5432/fatebook_development
          # pi-lens-ignore: line-length
          DATABASE_DIRECT_URL: postgresql://fatebook:postgres@localhost:5432/fatebook_development

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # pi-lens-ignore: line-length
          DATABASE_URL: postgresql://fatebook:postgres@localhost:5432/fatebook_development
          # pi-lens-ignore: line-length
          DATABASE_DIRECT_URL: postgresql://fatebook:postgres@localhost:5432/fatebook_development
          NEXTAUTH_URL: http://localhost:3000/api/auth
          HOST_URL: http://localhost:3000
          AUTH_EMAIL_SERVER: smtp://localhost:1025
          AUTH_EMAIL_FROM: fatebook@localhost
          SECRET: e2e-test-secret-do-not-use-in-production

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
